{{- if include "claude-code-insights.createSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "claude-code-insights.fullname" . }}
  labels:
    {{- include "claude-code-insights.labels" . | nindent 4 }}
type: Opaque
data:
  {{- with .Values.secrets.otelIngestToken }}
  otel-ingest-token: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.secrets.adminApiKey }}
  admin-api-key: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.secrets.enterpriseAnalyticsKey }}
  enterprise-analytics-key: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.secrets.foundryApiKey }}
  foundry-api-key: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.secrets.adminPassword }}
  admin-password: {{ . | b64enc | quote }}
  {{- end }}
{{- end }}
