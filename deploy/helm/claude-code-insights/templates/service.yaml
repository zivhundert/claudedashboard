apiVersion: v1
kind: Service
metadata:
  name: {{ include "claude-code-insights.fullname" . }}
  labels:
    {{- include "claude-code-insights.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    {{- if ne (toString .Values.otelPort) "" }}
    - name: otel
      port: {{ .Values.otelPort }}
      targetPort: otel
      protocol: TCP
    {{- end }}
  selector:
    {{- include "claude-code-insights.selectorLabels" . | nindent 4 }}
